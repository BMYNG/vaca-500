 const bindHome=()=>{const hm=document.getElementById("hm");if(!hm)return;hm.onclick=()=>{document.getElementById("xc").innerHTML='<div class="xcb"><span>나가면 처음부터 다시 풀어야 해요.</span><button id="xo">나가기</button><button id="xk">계속</button></div>';document.getElementById("xo").onclick=()=>{stop();CUR=null;try{speechSynthesis.cancel()}catch(e){}home()};document.getElementById("xk").onclick=()=>{document.getElementById("xc").innerHTML=""}}};
 const next=()=>{stop();i++;i<q.length?show():end()};
 function show(){const z=q[i];
  if(z.k!==cur){cur=z.k;const n=q.filter(x=>x.k==cur).length;
   A.innerHTML=`<div class="top"><button class="hm" id="hm">🏠 홈</button></div><p class="who">Day ${d} · ${esc(nm)} <span class="lv">${lvl()}</span></p><div id="xc"></div><div class="cert"><p class="s">${cur+1} / ${TY.length}</p><h1>유형 ${cur+1}</h1><h2>${TY[cur][0]}</h2><p>${TY[cur][1]}</p><p class="s">총 ${n}문제 · 문제당 ${cur==2?30:15}초</p></div><button class="nx" id="gs">시작하기</button>`;
   document.getElementById("gs").onclick=draw;bindHome();return}
  draw()}
 function draw(){stop();const z=q[i],k=z.k,L="ABCDE",grp=q.filter(x=>x.k==k),pos=grp.indexOf(z);const T=k==2?30:15;let left=T;
  A.innerHTML=`<div class="top"><button class="hm" id="hm">🏠 홈</button><span style="display:flex;gap:10px;align-items:center"><b>${pos+1} / ${grp.length}</b>${k==0?sp(z.t):""}</span></div><p class="who">Day ${d} · ${esc(nm)} <span class="lv">${lvl()}</span></p><div id="xc"></div><div class="pb"><i style="width:${pos/grp.length*100}%"></i></div><div class="tmr" id="tmr"><span id="sec">⏱ ${T}초</span><div class="tb"><i id="tbar" style="transition-duration:${T}s"></i></div></div><p class="q">${QL[k]}</p><div class="qt${k==2?" sn":""}">${z.t}</div>`+(z.h?`<button class="hb" id="hb">💡 힌트 보기 (직독해석)</button><div class="hn" id="hn" hidden>${z.h}</div>`:"")+
  z.o.map((o,j)=>`<div class="orow"><button class="o${pick[i]===j?" sel":""}" data-j="${j}"><b>${L[j]}</b>${o}</button>${k!=0?sp(o):""}</div>`).join("")+
  `<button class="nx" id="go" ${pick[i]==null?"disabled":""}>${i+1<q.length?"다음 문제":"제출하기"}</button>`;
  A.querySelectorAll(".o").forEach(b=>b.onclick=()=>{pick[i]=+b.dataset.j;A.querySelectorAll(".o").forEach(x=>x.classList.toggle("sel",x===b));document.getElementById("go").disabled=false});
  document.getElementById("go").onclick=next;bindHome();
  const hb=document.getElementById("hb");if(hb)hb.onclick=()=>{const n=document.getElementById("hn");n.hidden=!n.hidden;hb.textContent=n.hidden?"💡 힌트 보기 (직독해석)":"💡 힌트 숨기기"};
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=document.getElementById("tbar");if(b)b.classList.add("go")}));
  tm=setInterval(()=>{left--;const s=document.getElementById("sec"),t=document.getElementById("tmr");if(s)s.textContent="⏱ "+left+"초";if(t&&left<=5)t.classList.add("warn");if(left<=0)next()},1000);
  if(k==0)say(z.t)}
 function end(){stop();const wr=q.filter((z,j)=>z.o[pick[j]]!==z.a),sc=Math.floor((q.length-wr.length)/q.length*100);
  S[d]=Math.max(S[d]||0,sc);save();
  if(!wr.length){saveCert(d,nm);showCert(d);return}
  A.innerHTML=`<h2>${nm}님의 결과</h2><div class="card"><div class="sc">${sc}점</div><p>${q.length}문제 중 ${q.length-wr.length}개 정답입니다.</p><div class="pb"><i style="width:${sc}%"></i></div><p class="s">100점이어야 수료증이 나옵니다. 다시 도전해 보세요!</p></div><h2>복습이 필요한 문제</h2>`+
  TY.map((t,k)=>{const g=wr.filter(z=>z.k==k);return g.length?`<h3 class="gh">유형 ${k+1}. ${t[0]} <small>(${g.length}문제)</small></h3>`+g.map(z=>`<div class="wr">${k==2?z.t.replace("___","<b>"+z.a+"</b>"):z.t+" → <b>"+z.a+"</b>"} ${sp(k==0?z.t:z.a)}</div>`).join(""):""}).join("")+`<button class="nx" id="rt">처음부터 다시 도전</button><button class="b" onclick="home()">‹ 전체 Day</button>`;
  document.getElementById("rt").onclick=()=>run(d,nm)}
 show()}
